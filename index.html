<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Voci Trainer</title>
  <style>
    :root {
      --bg: #F2F2F7;
      --card-bg: #FFFFFF;
      --label-primary: #000000;
      --label-secondary: #8E8E93;
      --blue: #007AFF;
      --green: #34C759;
      --red: #FF3B30;
      --yellow: #FFCC00;
      --yellow-text: #895C00;
      --border: #E5E5EA;
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--label-primary);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      padding-top: calc(env(safe-area-inset-top, 16px) + 8px);
      padding-bottom: calc(env(safe-area-inset-bottom, 16px) + 8px);
    }

    .app-viewport {
      width: 100%;
      max-width: 414px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .segmented-control {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #7676801F;
      border-radius: 9px;
      padding: 2px;
      position: relative;
    }

    .segment-btn {
      border: none;
      background: transparent;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
      color: #3C3C4399;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
    }

    .segment-btn.active {
      background: #FFFFFF;
      color: var(--label-primary);
      font-weight: 600;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.12), 0 0 1px rgba(0, 0, 0, 0.04);
    }

    .status-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 2px;
    }

    .counter-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 500;
      color: var(--label-secondary);
      letter-spacing: -0.2px;
    }

    .counter-item span {
      font-weight: 600;
      color: var(--label-primary);
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: #E5E5EA;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-indicator {
      height: 100%;
      width: 0%;
      background: var(--green);
      border-radius: 3px;
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .flashcard {
      background: var(--card-bg);
      border-radius: 20px;
      min-height: 240px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      cursor: pointer;
      user-select: none;
      text-align: center;
      transition: transform 0.12s ease;
      position: relative;
    }

    .flashcard:active {
      transform: scale(0.99);
    }

    .badge-pill {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 20px;
      display: inline-block;
    }

    .badge-rep {
      background: #FFF8E1;
      color: var(--yellow-text);
      border: 1px solid #FFE082;
    }

    .badge-new {
      background: #F2F2F7;
      color: #636366;
    }

    .badge-training {
      background: #E5F1FF;
      color: var(--blue);
    }

    .card-term {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--label-primary);
      margin-bottom: 12px;
      word-break: break-word;
      line-height: 1.2;
    }

    .card-def {
      font-size: 22px;
      font-weight: 600;
      color: var(--blue);
      letter-spacing: -0.3px;
      word-break: break-word;
      line-height: 1.25;
      display: none;
      animation: fadeIn 0.18s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-hint {
      font-size: 13px;
      font-weight: 500;
      color: #C7C7CC;
      margin-top: 24px;
    }

    .action-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-action {
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .btn-action:active {
      opacity: 0.75;
      transform: scale(0.98);
    }

    .btn-wrong {
      background: var(--red);
      color: #FFFFFF;
    }

    .btn-right {
      background: var(--green);
      color: #FFFFFF;
    }

    .utility-sheet {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .utility-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-sub {
      border: none;
      border-radius: 10px;
      padding: 11px;
      font-size: 13px;
      font-weight: 600;
      background: #F2F2F7;
      color: #3C3C43;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-sub:active {
      background: #E5E5EA;
    }

    .drawer-content {
      display: none;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    textarea.ios-input {
      width: 100%;
      height: 140px;
      border-radius: 12px;
      border: 1px solid #D1D1D6;
      padding: 12px;
      font-size: 13px;
      font-family: inherit;
      color: var(--label-primary);
      background: #FAF9FA;
      resize: none;
      outline: none;
    }

    textarea.ios-input:focus {
      border-color: var(--blue);
      background: #FFFFFF;
    }
  </style>
</head>
<body>

<div class="app-viewport">
  <div class="segmented-control">
    <button class="segment-btn active" id="modeFocus" onclick="switchMode('focus')">Fokus (4 Neu / 1 Rep)</button>
    <button class="segment-btn" id="modeReview" onclick="switchMode('review')">Festigen (1 Neu / 4 Rep)</button>
  </div>

  <div class="status-panel">
    <div class="counter-row">
      <div class="counter-item">Ungelernt: <span id="countUnlearned">0</span></div>
      <div class="counter-item">Training: <span id="countTraining">0</span></div>
      <div class="counter-item">Gelernt: <span id="countLearned">0</span></div>
    </div>
    <div class="progress-track">
      <div class="progress-indicator" id="progressFill"></div>
    </div>
  </div>

  <div class="flashcard" id="mainCard" onclick="handleCardFlip()">
    <div class="badge-pill badge-new" id="cardBadge">Neu (0/2)</div>
    <div class="card-term" id="cardTerm">Keine Vokabeln vorhanden</div>
    <div class="card-def" id="cardDef"></div>
    <div class="card-hint" id="cardHint">Antippen zum Umdrehen</div>
  </div>

  <div class="action-group" id="actionPanel" style="visibility: hidden;">
    <button class="btn-action btn-wrong" onclick="processAnswer(false)">Noch nicht</button>
    <button class="btn-action btn-right" onclick="processAnswer(true)">Gewusst</button>
  </div>

  <div class="utility-sheet">
    <div class="utility-bar">
      <button class="btn-sub" onclick="toggleDrawer('exportDrawer'); prepareCleanExport();">Export / Import</button>
      <button class="btn-sub" onclick="toggleDrawer('inputDrawer')">+ Voci eingeben</button>
    </div>

    <div class="drawer-content" id="exportDrawer">
      <textarea class="ios-input" id="exportArea" placeholder="Text hier kopieren oder einfügen..."></textarea>
      <div class="utility-bar">
        <button class="btn-sub" style="background: var(--blue); color: #fff;" onclick="executeRobustImport()">Stand laden</button>
        <button class="btn-sub" onclick="toggleDrawer('exportDrawer')">Fertig</button>
      </div>
    </div>

    <div class="drawer-content" id="inputDrawer">
      <textarea class="ios-input" id="inputArea" placeholder="Format: Begriff = Übersetzung&#10;Oder direkt aus Quizlet per Tab getrennt"></textarea>
      <div class="utility-bar">
        <button class="btn-sub" style="background: var(--green); color: #fff;" onclick="addNewWords()">Hinzufügen</button>
        <button class="btn-sub" onclick="toggleDrawer('inputDrawer')">Fertig</button>
      </div>
    </div>
  </div>
</div>

<script>
  let vocabulary = [];
  let currentMode = 'focus';
  let activeBatch = [];
  let pointer = 0;
  let isCardRevealed = false;

  const STORAGE_KEY = 'voci_data_v2';

  function initApp() {
    loadDatabase();
    recalculateBatch();
    renderScreen();
  }

  function loadDatabase() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try {
        vocabulary = JSON.parse(raw);
      } catch (e) {
        vocabulary = [];
      }
    }
  }

  function persistDatabase() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(vocabulary));
  }

  function switchMode(mode) {
    currentMode = mode;
    document.getElementById('modeFocus').className = 'segment-btn' + (mode === 'focus' ? ' active' : '');
    document.getElementById('modeReview').className = 'segment-btn' + (mode === 'review' ? ' active' : '');
    recalculateBatch();
    resetCardView();
    renderScreen();
  }

  function recalculateBatch() {
    const unmastered = vocabulary.filter(w => w.score < 2);
    const mastered = vocabulary.filter(w => w.score >= 2);

    const targetUnmastered = currentMode === 'focus' ? 4 : 1;
    const targetMastered = currentMode === 'focus' ? 1 : 4;

    const nextBatch = [];

    // Priorität 1: Unbeendete Karten einpflegen
    for (let i = 0; i < unmastered.length && nextBatch.length < targetUnmastered; i++) {
      nextBatch.push(unmastered[i]);
    }

    // Priorität 2: Wiederholungskarten einsteuern
    for (let i = 0; i < mastered.length && nextBatch.length < (targetUnmastered + targetMastered); i++) {
      if (!nextBatch.includes(mastered[i])) {
        nextBatch.push(mastered[i]);
      }
    }

    // Priorität 3: Falls noch Platz (z. B. zu Beginn wenig Gelerntes vorhanden)
    for (let i = 0; i < unmastered.length && nextBatch.length < 5; i++) {
      if (!nextBatch.includes(unmastered[i])) {
        nextBatch.push(unmastered[i]);
      }
    }

    activeBatch = nextBatch;
    if (pointer >= activeBatch.length) {
      pointer = 0;
    }
  }

  function handleCardFlip() {
    if (activeBatch.length === 0) return;
    isCardRevealed = !isCardRevealed;
    
    document.getElementById('cardDef').style.display = isCardRevealed ? 'block' : 'none';
    document.getElementById('cardHint').textContent = isCardRevealed ? 'Bewerte dein Wissen:' : 'Antippen zum Umdrehen';
    document.getElementById('actionPanel').style.visibility = isCardRevealed ? 'visible' : 'hidden';
  }

  function processAnswer(known) {
    if (activeBatch.length === 0) return;
    const card = activeBatch[pointer];
    const isRepetition = card.score >= 2;

    if (known) {
      if (isRepetition) {
        card.score = 2; // Bestätigt, bleibt gemeistert
      } else {
        card.score = (card.score || 0) + 1;
      }
    } else {
      card.score = 0; // Fällt bei Fehler sofort auf 0
    }

    persistDatabase();
    recalculateBatch();

    if (activeBatch.length > 0) {
      pointer = (pointer + 1) % activeBatch.length;
    } else {
      pointer = 0;
    }

    resetCardView();
    renderScreen();
  }

  function resetCardView() {
    isCardRevealed = false;
    document.getElementById('cardDef').style.display = 'none';
    document.getElementById('actionPanel').style.visibility = 'hidden';
    document.getElementById('cardHint').textContent = 'Antippen zum Umdrehen';
  }

  function renderScreen() {
    const unlearned = vocabulary.filter(w => w.score === 0).length;
    const training = vocabulary.filter(w => w.score === 1).length;
    const learned = vocabulary.filter(w => w.score >= 2).length;
    const total = vocabulary.length;

    document.getElementById('countUnlearned').textContent = unlearned;
    document.getElementById('countTraining').textContent = training;
    document.getElementById('countLearned').textContent = learned;

    const percentage = total === 0 ? 0 : Math.round((learned / total) * 100);
    document.getElementById('progressFill').style.width = percentage + '%';

    const badge = document.getElementById('cardBadge');
    const termEl = document.getElementById('cardTerm');
    const defEl = document.getElementById('cardDef');

    if (activeBatch.length > 0) {
      pointer = pointer % activeBatch.length;
      const card = activeBatch[pointer];

      termEl.textContent = card.term;
      defEl.textContent = card.definition;

      badge.style.display = 'inline-block';
      if (card.score >= 2) {
        badge.className = 'badge-pill badge-rep';
        badge.textContent = '🔁 Repetition';
      } else if (card.score === 1) {
        badge.className = 'badge-pill badge-training';
        badge.textContent = 'Im Training (1/2)';
      } else {
        badge.className = 'badge-pill badge-new';
        badge.textContent = 'Neu (0/2)';
      }
    } else {
      badge.style.display = 'none';
      termEl.textContent = total > 0 ? 'Alles gemeistert!' : 'Keine Vokabeln geladen';
      defEl.textContent = '';
      document.getElementById('cardHint').textContent = total > 0 ? 'Klicke auf Festigen oder füge neue Voci hinzu.' : 'Unten neue Voci einfügen.';
    }
  }

  function toggleDrawer(id) {
    const el = document.getElementById(id);
    const isOpen = el.style.display === 'flex';
    document.getElementById('exportDrawer').style.display = 'none';
    document.getElementById('inputDrawer').style.display = 'none';
    el.style.display = isOpen ? 'none' : 'flex';
  }

  function addNewWords() {
    const raw = document.getElementById('inputArea').value;
    const lines = raw.split('\n');
    let count = 0;

    lines.forEach(line => {
      let sep = line.includes('\t') ? '\t' : '=';
      const parts = line.split(sep);
      if (parts.length >= 2) {
        const t = cleanWord(parts[0]);
        const d = cleanWord(parts.slice(1).join(sep));
        if (t && d) {
          vocabulary.push({
            id: Date.now() + Math.random(),
            term: t,
            definition: d,
            score: 0
          });
          count++;
        }
      }
    });

    if (count > 0) {
      persistDatabase();
      recalculateBatch();
      document.getElementById('inputArea').value = '';
      toggleDrawer('inputDrawer');
      renderScreen();
    }
  }

  function cleanWord(str) {
    if (!str) return '';
    return str
      .replace(/\[Score:\s*\d+\]/gi, '')
      .replace(/\[Punkte:\s*.*?\]/gi, '')
      .replace(/\(Score:\s*\d+\)/gi, '')
      .trim();
  }

  function prepareCleanExport() {
    const training = vocabulary.filter(w => w.score === 1);
    const learned = vocabulary.filter(w => w.score >= 2);
    const unlearned = vocabulary.filter(w => w.score === 0);

    let doc = `=== GELERNT (2/2) ===\n`;
    learned.forEach(w => { doc += `${w.term} = ${w.definition}\n`; });

    doc += `\n=== TRAINING (1/2) ===\n`;
    training.forEach(w => { doc += `${w.term} = ${w.definition}\n`; });

    doc += `\n=== UNGELERNT (0/2) ===\n`;
    unlearned.forEach(w => { doc += `${w.term} = ${w.definition}\n`; });

    document.getElementById('exportArea').value = doc;
  }

  function executeRobustImport() {
    const raw = document.getElementById('exportArea').value;
    const lines = raw.split('\n');

    let sectionScore = 0;
    const sanitizedList = [];

    lines.forEach(line => {
      const trimmed = line.trim();
      if (!trimmed) return;

      if (trimmed.includes('=== GELERNT')) { sectionScore = 2; return; }
      if (trimmed.includes('=== TRAINING') || trimmed.includes('=== NOCH AM LERNEN')) { sectionScore = 1; return; }
      if (trimmed.includes('=== UNGELERNT') || trimmed.includes('=== NICHT ANGESCHAUT')) { sectionScore = 0; return; }

      let sep = trimmed.includes('\t') ? '\t' : '=';
      const parts = trimmed.split(sep);
      if (parts.length >= 2) {
        const t = cleanWord(parts[0]);
        const d = cleanWord(parts.slice(1).join(sep));
        if (t && d) {
          sanitizedList.push({
            id: Date.now() + Math.random(),
            term: t,
            definition: d,
            score: sectionScore
          });
        }
      }
    });

    if (sanitizedList.length > 0) {
      vocabulary = sanitizedList;
      persistDatabase();
      recalculateBatch();
      renderScreen();
      toggleDrawer('exportDrawer');
    }
  }

  initApp();
</script>
</body>
</html>
