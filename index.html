<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Voci Trainer</title>
  <style>
    :root {
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --text: #000000;
      --text-sub: #8E8E93;
      --blue: #007AFF;
      --green: #34C759;
      --red: #FF3B30;
      --yellow: #FFCC00;
      --yellow-text: #895C00;
      --border: #E5E5EA;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.02);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      padding-top: calc(env(safe-area-inset-top, 16px) + 8px);
      padding-bottom: calc(env(safe-area-inset-bottom, 16px) + 12px);
    }

    .app-container {
      width: 100%;
      max-width: 414px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .segmented-control {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #7676801F;
      border-radius: 9px;
      padding: 2px;
      user-select: none;
    }

    .segment-btn {
      border: none;
      background: transparent;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 500;
      color: #3C3C4399;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .segment-btn.active {
      background: #FFFFFF;
      color: var(--text);
      font-weight: 600;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.12), 0 0 1px rgba(0, 0, 0, 0.04);
    }

    .status-panel {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 4px;
    }

    .counter-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-sub);
    }

    .counter-row b {
      color: var(--text);
      font-weight: 600;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: #E5E5EA;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--green);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .flashcard {
      background: var(--card);
      border-radius: 20px;
      min-height: 250px;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      cursor: pointer;
      user-select: none;
      text-align: center;
      transition: transform 0.12s ease;
    }

    .flashcard:active {
      transform: scale(0.99);
    }

    .badge-pill {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 20px;
      display: inline-block;
    }

    .badge-rep {
      background: #FFF8E1;
      color: var(--yellow-text);
      border: 1px solid #FFE082;
    }

    .badge-new {
      background: #F2F2F7;
      color: #636366;
    }

    .badge-training {
      background: #E5F1FF;
      color: var(--blue);
    }

    .card-term {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 12px;
      word-break: break-word;
      line-height: 1.2;
    }

    .card-def {
      font-size: 22px;
      font-weight: 600;
      color: var(--blue);
      letter-spacing: -0.3px;
      word-break: break-word;
      line-height: 1.25;
      display: none;
      animation: fadeIn 0.18s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-hint {
      font-size: 13px;
      font-weight: 500;
      color: #C7C7CC;
      margin-top: 24px;
    }

    .action-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-action {
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .btn-action:active {
      opacity: 0.75;
      transform: scale(0.98);
    }

    .btn-wrong {
      background: var(--red);
      color: #FFFFFF;
    }

    .btn-right {
      background: var(--green);
      color: #FFFFFF;
    }

    .utility-sheet {
      background: var(--card);
      border-radius: 18px;
      padding: 12px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .utility-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-sub {
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      background: #F2F2F7;
      color: #3C3C43;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-sub:active {
      background: #E5E5EA;
    }

    .drawer-content {
      display: none;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    textarea.ios-input {
      width: 100%;
      height: 130px;
      border-radius: 10px;
      border: 1px solid #D1D1D6;
      padding: 10px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: #FAF9FA;
      resize: none;
      outline: none;
    }

    textarea.ios-input:focus {
      border-color: var(--blue);
      background: #FFFFFF;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="segmented-control">
    <button class="segment-btn active" id="modeFocus" onclick="switchMode('fokus')">Fokus (4 Neu / 1 Rep)</button>
    <button class="segment-btn" id="modeReview" onclick="switchMode('festigen')">Festigen (1 Neu / 4 Rep)</button>
  </div>

  <div class="status-panel">
    <div class="counter-row">
      <div>Ungelernt: <b id="countUnlearned">0</b></div>
      <div>Training: <b id="countTraining">0</b></div>
      <div>Gelernt: <b id="countLearned">0</b></div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="flashcard" id="mainCard" onclick="toggleCard()">
    <div class="badge-pill badge-new" id="cardBadge">Neu (0/2)</div>
    <div class="card-term" id="cardTerm">Keine Vokabeln vorhanden</div>
    <div class="card-def" id="cardDef"></div>
    <div class="card-hint" id="cardHint">Antippen zum Umdrehen</div>
  </div>

  <div class="action-group" id="actionPanel" style="visibility: hidden;">
    <button class="btn-action btn-wrong" onclick="processAnswer(false)">Noch nicht</button>
    <button class="btn-action btn-right" onclick="processAnswer(true)">Gewusst</button>
  </div>

  <div class="utility-sheet">
    <div class="utility-bar">
      <button class="btn-sub" onclick="toggleDrawer('exportDrawer'); prepareExport();">Export / Import</button>
      <button class="btn-sub" onclick="toggleDrawer('inputDrawer')">+ Voci eingeben</button>
    </div>

    <div class="drawer-content" id="exportDrawer">
      <textarea class="ios-input" id="exportArea" placeholder="Text hier kopieren oder einfügen..."></textarea>
      <div class="utility-bar">
        <button class="btn-sub" style="background: var(--blue); color: #fff;" onclick="executeImport()">Stand laden</button>
        <button class="btn-sub" onclick="toggleDrawer('exportDrawer')">Schliessen</button>
      </div>
    </div>

    <div class="drawer-content" id="inputDrawer">
      <textarea class="ios-input" id="inputArea" placeholder="Format: Begriff = Übersetzung&#10;Oder aus Quizlet per Tab getrennt"></textarea>
      <div class="utility-bar">
        <button class="btn-sub" style="background: var(--green); color: #fff;" onclick="addVocab()">Hinzufügen</button>
        <button class="btn-sub" onclick="toggleDrawer('inputDrawer')">Schliessen</button>
      </div>
    </div>
  </div>
</div>

<script>
  let vocabList = [];
  let activePool = [];
  let currentMode = 'fokus';
  let currentIndex = 0;
  let isFlipped = false;
  const POOL_SIZE = 5;
  const STORAGE_KEY = 'voci_data_v3';

  function init() {
    loadData();
    fillActivePool();
    renderUI();
  }

  function loadData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try {
        vocabList = JSON.parse(raw);
      } catch (e) {
        vocabList = [];
      }
    }
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(vocabList));
  }

  function switchMode(newMode) {
    currentMode = newMode;
    document.getElementById('modeFocus').className = 'segment-btn' + (newMode === 'fokus' ? ' active' : '');
    document.getElementById('modeReview').className = 'segment-btn' + (newMode === 'festigen' ? ' active' : '');
    
    // Aktiven Pool neu berechnen und Karten zurücksetzen
    activePool = [];
    currentIndex = 0;
    fillActivePool();
    resetCard();
    renderUI();
  }

  function fillActivePool() {
    const masteredList = vocabList.filter(item => item.score >= 2);
    // Repetition erst zulassen, wenn mindestens 3 gemeisterte Wörter vorhanden sind
    const allowRep = masteredList.length >= 3;

    let repTarget = 0;
    if (allowRep) {
      repTarget = currentMode === 'fokus' ? 1 : Math.min(4, masteredList.length);
    }
    const learnTarget = POOL_SIZE - repTarget;

    // 1. Lernkarten auffüllen (Score 0 oder 1)
    const availableLearning = vocabList.filter(item => 
      item.score < 2 && !activePool.some(c => c.id === item.id)
    );

    while (activePool.filter(c => !c.isRep).length < learnTarget && availableLearning.length > 0) {
      const item = availableLearning.shift();
      activePool.push({ id: item.id, term: item.term, def: item.def, score: item.score, isRep: false });
    }

    // 2. Repetition auffüllen: Strikt nach ältestem Zeitstempel (FIFO Cooldown gegen Dauer-Wiederholer)
    if (allowRep) {
      const availableRep = vocabList
        .filter(item => item.score >= 2 && !activePool.some(c => c.id === item.id))
        .sort((a, b) => (a.lastSeen || 0) - (b.lastSeen || 0));

      while (activePool.filter(c => c.isRep).length < repTarget && availableRep.length > 0) {
        const nextRep = availableRep.shift();
        activePool.push({ id: nextRep.id, term: nextRep.term, def: nextRep.def, score: nextRep.score, isRep: true });
      }
    }

    // 3. Fallback: Falls noch Plätze frei sind (z. B. keine ungesehenen Wörter mehr), mit Rest füllen
    while (activePool.length < POOL_SIZE) {
      const anyFree = vocabList.find(item => !activePool.some(c => c.id === item.id));
      if (!anyFree) break;
      activePool.push({ 
        id: anyFree.id, 
        term: anyFree.term, 
        def: anyFree.def, 
        score: anyFree.score, 
        isRep: anyFree.score >= 2 
      });
    }

    if (currentIndex >= activePool.length) {
      currentIndex = 0;
    }
  }

  function toggleCard() {
    if (activePool.length === 0) return;
    isFlipped = !isFlipped;
    document.getElementById('cardDef').style.display = isFlipped ? 'block' : 'none';
    document.getElementById('cardHint').textContent = isFlipped ? 'Bewerte dein Wissen:' : 'Antippen zum Umdrehen';
    document.getElementById('actionPanel').style.visibility = isFlipped ? 'visible' : 'hidden';
  }

  function processAnswer(known) {
    if (activePool.length === 0) return;
    const currentCard = activePool[currentIndex];
    const originalItem = vocabList.find(i => i.id === currentCard.id);

    if (originalItem) {
      originalItem.lastSeen = Date.now();

      if (currentCard.isRep) {
        if (known) {
          // Repetition 1x gewusst: Sofort fertig, verlässt den Pool, bleibt bei Score 2
          activePool.splice(currentIndex, 1);
        } else {
          // Repetition vergessen: Fällt auf 0 zurück, wird zu einer regulären Baustelle
          originalItem.score = 0;
          currentCard.score = 0;
          currentCard.isRep = false;
          currentIndex = (currentIndex + 1) % activePool.length;
        }
      } else {
        if (known) {
          originalItem.score = (originalItem.score || 0) + 1;
          if (originalItem.score >= 2) {
            // Gemeistert: Verlässt den aktiven Lernpool
            activePool.splice(currentIndex, 1);
          } else {
            currentCard.score = originalItem.score;
            currentIndex = (currentIndex + 1) % activePool.length;
          }
        } else {
          originalItem.score = 0;
          currentCard.score = 0;
          currentIndex = (currentIndex + 1) % activePool.length;
        }
      }
    }

    fillActivePool();
    resetCard();
    saveData();
    renderUI();
  }

  function resetCard() {
    isFlipped = false;
    document.getElementById('cardDef').style.display = 'none';
    document.getElementById('actionPanel').style.visibility = 'hidden';
    document.getElementById('cardHint').textContent = 'Antippen zum Umdrehen';
  }

  function renderUI() {
    const unlearned = vocabList.filter(w => w.score === 0).length;
    const training = vocabList.filter(w => w.score === 1).length;
    const learned = vocabList.filter(w => w.score >= 2).length;
    const total = vocabList.length;

    document.getElementById('countUnlearned').textContent = unlearned;
    document.getElementById('countTraining').textContent = training;
    document.getElementById('countLearned').textContent = learned;

    const percentage = total === 0 ? 0 : Math.round((learned / total) * 100);
    document.getElementById('progressFill').style.width = percentage + '%';

    const badge = document.getElementById('cardBadge');
    const termEl = document.getElementById('cardTerm');
    const defEl = document.getElementById('cardDef');

    if (activePool.length > 0) {
      currentIndex = currentIndex % activePool.length;
      const card = activePool[currentIndex];

      termEl.textContent = card.term;
      defEl.textContent = card.def;

      badge.style.display = 'inline-block';
      if (card.isRep) {
        badge.className = 'badge-pill badge-rep';
        badge.textContent = '🔁 Repetition';
      } else if (card.score === 1) {
        badge.className = 'badge-pill badge-training';
        badge.textContent = 'Im Training (1/2)';
      } else {
        badge.className = 'badge-pill badge-new';
        badge.textContent = 'Neu (0/2)';
      }
    } else {
      badge.style.display = 'none';
      termEl.textContent = total > 0 ? 'Alles gemeistert!' : 'Keine Vokabeln vorhanden';
      defEl.textContent = '';
      document.getElementById('cardHint').textContent = total > 0 ? 'Schalte auf Festigen um oder füge neue Voci hinzu.' : 'Unten neue Voci eingeben.';
    }
  }

  function toggleDrawer(id) {
    const el = document.getElementById(id);
    const isOpen = el.style.display === 'flex';
    document.getElementById('exportDrawer').style.display = 'none';
    document.getElementById('inputDrawer').style.display = 'none';
    el.style.display = isOpen ? 'none' : 'flex';
  }

  function cleanString(str) {
    if (!str) return '';
    return str
      .replace(/\[Score:\s*\d+\]/gi, '')
      .replace(/\[Punkte:\s*.*?\]/gi, '')
      .replace(/\(Score:\s*\d+\)/gi, '')
      .trim();
  }

  function addVocab() {
    const raw = document.getElementById('inputArea').value;
    const lines = raw.split('\n');
    let added = 0;

    lines.forEach(line => {
      let sep = line.includes('\t') ? '\t' : '=';
      const parts = line.split(sep);
      if (parts.length >= 2) {
        const t = cleanString(parts[0]);
        const d = cleanString(parts.slice(1).join(sep));
        if (t && d) {
          vocabList.push({
            id: Date.now() + Math.random(),
            term: t,
            def: d,
            score: 0,
            lastSeen: 0
          });
          added++;
        }
      }
    });

    if (added > 0) {
      saveData();
      fillActivePool();
      document.getElementById('inputArea').value = '';
      toggleDrawer('inputDrawer');
      renderUI();
    }
  }

  function prepareExport() {
    const learned = vocabList.filter(w => w.score >= 2);
    const training = vocabList.filter(w => w.score === 1);
    const unlearned = vocabList.filter(w => w.score === 0);

    let doc = `=== GELERNT (2/2) ===\n`;
    learned.forEach(w => { doc += `${w.term} = ${w.def}\n`; });

    doc += `\n=== TRAINING (1/2) ===\n`;
    training.forEach(w => { doc += `${w.term} = ${w.def}\n`; });

    doc += `\n=== UNGELERNT (0/2) ===\n`;
    unlearned.forEach(w => { doc += `${w.term} = ${w.def}\n`; });

    document.getElementById('exportArea').value = doc;
  }

  function executeImport() {
    const raw = document.getElementById('exportArea').value;
    const lines = raw.split('\n');

    let currentScore = 0;
    const parsedList = [];

    lines.forEach(line => {
      const trimmed = line.trim();
      if (!trimmed) return;

      if (trimmed.includes('=== GELERNT')) { currentScore = 2; return; }
      if (trimmed.includes('=== TRAINING') || trimmed.includes('=== NOCH AM LERNEN')) { currentScore = 1; return; }
      if (trimmed.includes('=== UNGELERNT') || trimmed.includes('=== NICHT ANGESCHAUT')) { currentScore = 0; return; }

      let sep = trimmed.includes('\t') ? '\t' : '=';
      const parts = trimmed.split(sep);
      if (parts.length >= 2) {
        const t = cleanString(parts[0]);
        const d = cleanString(parts.slice(1).join(sep));
        if (t && d) {
          parsedList.push({
            id: Date.now() + Math.random(),
            term: t,
            def: d,
            score: currentScore,
            lastSeen: currentScore >= 2 ? Date.now() : 0
          });
        }
      }
    });

    if (parsedList.length > 0) {
      vocabList = parsedList;
      activePool = [];
      currentIndex = 0;
      saveData();
      fillActivePool();
      renderUI();
      toggleDrawer('exportDrawer');
    }
  }

  window.onload = init;
</script>
</body>
</html>
